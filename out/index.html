<script type="application/json" id="appendix-data">{"version":"2026-10-08","modules":[{"id":"a","label":"Infra","icon":"rack","title":"AI Infrastructure System Design (incl. HPC)","intro":"A GPU cluster is a single machine only when every layer agrees: GPUs, NVLink domains, NICs, fabric, drivers, schedulers and storage. Readiness is the evidence that they agree under real load. This module refreshes the physical and platform layers NVCRE exercises. Read it as a map of where faults hide and which tool can see them.","selfCheck":["Can you explain why a cluster passing DCGM level 4 can still fail full-scale all-reduce?","Can you explain what NVSentinel does that NVCRE deliberately doesn’t?","Can you explain why an MNNVL-disabled GB200 run shows ~4.6× lower busBW?"]},{"id":"b","label":"Inference","icon":"stream","title":"Inference Engineering","intro":"Inference is an operation, not a project. Load is set by users, latency has SLOs, and cost scales with success. An LLM request has two phases: compute-bound prefill and bandwidth-bound decode. Most serving techniques trade between them. This module covers what an inference-cluster operator must reason about, and how far today’s training-oriented readiness checks get you.","selfCheck":["Can you explain why decode on H100 at batch 1 is memory-bound?","Can you explain why disaggregation turns the scale-out fabric into a latency-critical path?","Can you explain what ADR-082 v1 would NOT certify?"]},{"id":"c","label":"Kernels","icon":"chip","title":"GPU Kernel Engineering","intro":"Most cluster symptoms trace back to kernels: whether they saturate HBM or tensor cores, and whether collectives steal SMs. You don’t need to write CUDA to operate a cluster. You do need the roofline intuition and to know what NCCL kernels compete for.","selfCheck":["Can you explain why doubling FLOPs doesn’t speed up decode?","Can you explain why a collective can slow a concurrent GEMM?"]},{"id":"d","label":"Distributed","icon":"nodes","title":"Distributed Systems","intro":"A synchronous training job is a distributed system whose step time is its slowest member. NVCRE itself is a Kubernetes controller that reconciles desired state. This module refreshes both sides: failure models (gray, fail-slow, SDC) and the control-plane patterns the artifact’s diagrams use.","selfCheck":["Can you explain why reconcile must be idempotent?","Can you explain why bisection needs a deterministic failing signal?"]},{"id":"e","label":"Tradeoffs","icon":"scale","title":"Constraints & Tradeoffs","intro":"Every cluster design trades constraints against each other: memory against concurrency, NVLink domain size against blast radius, validation coverage against the GPUs it consumes. Each card names one constraint, the levers that move it, what you gain and pay, the failure signatures it leaves, and whether any NVCRE check sees it. Where no check exists, the card says so. The formula cards give the first-order math, and the explorer connects it to busBW you actually measured.","selfCheck":["Can you explain why a bigger NVLink domain raises busBW but also blast radius?","Can you explain why diagnose costs more runs when two nodes are faulty?"]}],"entries":[{"id":"a-readiness","module":"a","title":"Cluster readiness vs health","tier":"CORE","refresher":"Readiness means the cluster runs the target workload at the expected performance. Health means components report OK. Readiness is measured with real distributed load against thresholds; health comes from passive signals.","whyHere":"The artifact’s thesis: green health ≠ ready.","resources":["r-nvcre-intro","r-nvcre-results"],"startHere":"r-nvcre-intro","prereqs":[],"related":["d-gray-failure","a-passive-health","e-14"],"aliases":["acceptance","certification"],"flags":[],"anchors":["anc-readiness","anc-green-not-ready","anc-val-vs-work","anc-handoff"],"seenIn":["S1","S5","S6"],"cards":["e-14"],"formulas":[],"paths":[]},{"id":"a-nvcre-verdicts","module":"a","title":"NVCRE verdicts & reasons","tier":"CORE","refresher":"Results are PASSED, INCOMPLETE or FAILED (RUNNING while in progress). Each failed node carries a reason: ThresholdViolation, HardwareFailureDetected or WorkloadFailed. Failed nodes go into ConfigMaps referenced by failedNodesRef.","whyHere":"Read S5 verdicts precisely.","resources":["r-nvcre-interpret","r-nvcre-results","r-nvcre-repo"],"startHere":"r-nvcre-interpret","prereqs":[],"related":["a-readiness","d-conditions"],"aliases":["PASSED","FAILED","INCOMPLETE","ThresholdViolation","HardwareFailureDetected","WorkloadFailed","failedNodesRef"],"flags":[],"anchors":["anc-reasons","anc-incomplete"],"seenIn":["S1","S5"],"cards":[],"formulas":[],"paths":[]},{"id":"a-nvcre-testscale","module":"a","title":"testScale levels","tier":"CORE","refresher":"intra-node, intra-rack (grouped by nvidia.com/gpu.clique), full-scale and diagnose. Each scale exercises a different interconnect tier.","whyHere":"Maps faults to the tier that reveals them.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":["a-nvlink-domain","a-fabrics","d-group-testing"],"aliases":["intra-node","intra-rack","full-scale","diagnose"],"flags":[],"anchors":["anc-testscale"],"seenIn":["S4"],"cards":["e-03","e-15"],"formulas":[],"paths":[]},{"id":"a-nvcre-cli","module":"a","title":"nvcrectl & catalog","tier":"CORE","refresher":"A CLI for setup, render, run, report and cleanup, also usable as kubectl nvcre. The certification catalog is embedded in the binary, so adding a category needs a rebuild.","whyHere":"S4 walkthrough, S7 limits.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":[],"aliases":["kubectl nvcre","catalog"],"flags":[],"anchors":["anc-nvcrectl","anc-catalog"],"seenIn":["S4","S7"],"cards":[],"formulas":[],"paths":[]},{"id":"a-nvidia-stack","module":"a","title":"DSX OS: AICR, NVSentinel, NVCRE","tier":"CORE","refresher":"AICR pins config/version recipes. NVSentinel turns passive health into node conditions and taints. NVCRE actively certifies but never cordons.","whyHere":"Who quarantines vs who detects.","resources":["r-nvcre-repo","r-nvsentinel-monitor","r-aicr"],"startHere":"r-nvcre-repo","prereqs":[],"related":["a-stack-compat","d-taints"],"aliases":["DSX OS","AICR","NVSentinel"],"flags":[],"anchors":["anc-dsx"],"seenIn":["S6"],"cards":[],"formulas":[],"paths":[]},{"id":"a-reliability-data","module":"a","title":"Failure at scale (data)","tier":"CORE","refresher":"Llama 3: 419 unexpected interruptions in 54 days on 16,384 H100s, ~78% hardware-related. Meta’s research clusters: 11 months, 4M jobs and 150M+ A100 GPU-hours, used to fit an MTTF model.","whyHere":"Grounds the S2 hook.","resources":["r-llama3","r-meta-reliability","r-megascale","r-acme"],"startHere":"r-llama3","prereqs":[],"related":["e-08","f-15"],"aliases":["interruptions","MTTF","Llama 3"],"flags":[],"anchors":["anc-interruptions"],"seenIn":["S2"],"cards":["e-08"],"formulas":["f-12","f-15"],"paths":["p-4"]},{"id":"a-mfu","module":"a","title":"MFU","tier":"CORE","refresher":"Model FLOPs utilization: achieved model FLOP/s ÷ peak hardware FLOP/s, counting only the model’s FLOPs (not recomputation). Defined in the PaLM paper.","whyHere":"A threshold candidate (avgTFLOPsPerGPU).","resources":["r-palm","r-ultrascale"],"startHere":"r-palm","prereqs":[],"related":["f-04","f-03"],"aliases":["model FLOPs utilization"],"flags":[],"anchors":["anc-mfu"],"seenIn":["S2"],"cards":["e-08"],"formulas":["f-03","f-04"],"paths":[]},{"id":"a-goodput","module":"a","title":"Goodput (training)","tier":"CORE","refresher":"Fraction of wall time spent making useful forward progress. NVCRE parses it from pod logs and freezes it once the run completes; NVIDIA’s docs flag a ratio below ~0.95 as meaningful overhead.","whyHere":"goodputRatio threshold; differs from inference goodput.","resources":["r-nvcre-interpret"],"startHere":"r-nvcre-interpret","prereqs":[],"related":["b-goodput-slo"],"aliases":["goodputRatio","frozen"],"flags":[],"anchors":["anc-goodput","anc-frozen"],"seenIn":["S2","S5"],"cards":[],"formulas":[],"paths":[]},{"id":"a-burnin","module":"a","title":"Burn-in & infant mortality","tier":"CORE","refresher":"Failure rates follow a bathtub curve: high early, flat, then wear-out. Burn-in front-loads early failures before tenants arrive. Re-run it after repair or RMA.","whyHere":"S6 fit.","resources":["r-meta-reliability","r-stas-mle"],"startHere":"r-meta-reliability","prereqs":[],"related":["e-15","a-readiness"],"aliases":["bathtub curve","RMA","re-burn-in"],"flags":[],"anchors":["anc-burnin","anc-handoff"],"seenIn":["S6"],"cards":["e-08","e-15"],"formulas":[],"paths":["p-4"]},{"id":"a-dcgm","module":"a","title":"DCGM diagnostics levels","tier":"CORE","refresher":"dcgmi diag -r 1..4 runs quick → extended suites. Level 4 adds memtest (memory patterns) and pulse_test (rapid power-load swings that expose PSU/board instability).","whyHere":"NVCRE runs level 4.","resources":["r-dcgm-diag","r-dcgm-plugins"],"startHere":"r-dcgm-diag","prereqs":[],"related":["a-gpu-errors","e-09"],"aliases":["dcgmi","memtest","pulse_test","dcgm-level4"],"flags":[],"anchors":["anc-dcgm","anc-f-ecc"],"seenIn":["S6","C3"],"cards":["e-01","e-09"],"formulas":[],"paths":[]},{"id":"a-gpu-errors","module":"a","title":"ECC & XID errors","tier":"CORE","refresher":"ECC corrects or flags memory bit errors. XIDs are driver-reported GPU error codes. Both surface through DCGM, and through node conditions when a health agent sets them.","whyHere":"C3 fault menu.","resources":["r-dcgm-diag"],"startHere":"r-dcgm-diag","prereqs":[],"related":["a-dcgm","a-passive-health"],"aliases":["ECC","XID"],"flags":[],"anchors":["anc-f-ecc"],"seenIn":["C3"],"cards":[],"formulas":[],"paths":[]},{"id":"a-passive-health","module":"a","title":"Passive health checks","tier":"CORE","refresher":"LBNL NHC (Slurm) and Node Problem Detector (k8s) check node state periodically. They catch hard faults, not performance faults.","whyHere":"The contrast to active validation.","resources":["r-stas-mle"],"startHere":"r-stas-mle","prereqs":[],"related":["a-readiness","e-14"],"aliases":["NHC","Node Problem Detector"],"flags":[],"anchors":["anc-nhc"],"seenIn":["S6"],"cards":["e-14"],"formulas":[],"paths":[]},{"id":"a-gpu-discovery","module":"a","title":"GPU Operator & labels","tier":"CORE","refresher":"The GPU Operator deploys the driver, device plugin and GFD labels (nvidia.com/gpu.product). The Network Operator handles RDMA NICs.","whyHere":"NVCRE’s architecture detection.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":["a-dra"],"aliases":["GPU Operator","Network Operator","GFD","gpu.product"],"flags":[],"anchors":["anc-node-labels","anc-operators"],"seenIn":["S3","S6"],"cards":[],"formulas":[],"paths":[]},{"id":"a-dra","module":"a","title":"DRA, ResourceSlices, ComputeDomain","tier":"CORE","refresher":"Dynamic Resource Allocation advertises devices via ResourceSlices. NVIDIA’s DRA driver adds ComputeDomains for IMEX/MNNVL. NVCRE PR #419 reads GPU arch from ResourceSlices when GFD labels are absent.","whyHere":"DRA-only clusters.","resources":["r-nvcre-pr419"],"startHere":"r-nvcre-pr419","prereqs":[],"related":["a-gpu-discovery","a-nvlink-domain"],"aliases":["DRA","ResourceSlice","ComputeDomain","IMEX"],"flags":[],"anchors":["anc-node-labels","anc-imex"],"seenIn":["S3","C4/§7"],"cards":[],"formulas":[],"paths":[]},{"id":"a-nvlink-domain","module":"a","title":"NVLink, NVSwitch, NVL72 domain","tier":"CORE","refresher":"NVLink/NVSwitch is the scale-up fabric. NVL72 joins 72 GPUs in one NVLink domain (multi-node NVLink, MNNVL). A clique label marks GPUs sharing a domain.","whyHere":"intra-rack scale; MNNVL datapoint.","resources":["r-ie-gpu-inference","r-li-gpu-arch"],"startHere":"r-ie-gpu-inference","prereqs":[],"related":["e-03","a-nvcre-testscale"],"aliases":["MNNVL","NVSwitch","clique","gpu.clique"],"flags":[],"anchors":["anc-testscale","anc-mnnvl","anc-f-nvlink","anc-imex","anc-nvswitch"],"seenIn":["S4","C3","C4/§7"],"cards":["e-03"],"formulas":[],"paths":["p-1"]},{"id":"a-fabrics","module":"a","title":"Scale-out fabrics","tier":"CORE","refresher":"InfiniBand (credit-based, lossless), RoCE (Ethernet with PFC/ECN), AWS EFA (SRD) and GCP GPUDirect-TCPX(O). Rail-optimized topologies put same-index GPUs on a shared switch “rail”.","whyHere":"full-scale results.","resources":["r-railonly","r-stas-mle"],"startHere":"r-railonly","prereqs":[],"related":["e-07","a-rdma"],"aliases":["InfiniBand","IB","RoCE","EFA","TCPXO","rail"],"flags":[],"anchors":["anc-f-ib","anc-fabrics"],"seenIn":["C3","C4/§7"],"cards":["e-03","e-07"],"formulas":[],"paths":["p-1"]},{"id":"a-rdma","module":"a","title":"RDMA & NCCL net plugins","tier":"CORE","refresher":"NCCL reaches NICs through net plugins (e.g., aws-ofi-nccl for EFA). If the plugin fails to load, NCCL can fall back to TCP sockets: functional but orders of magnitude slower.","whyHere":"The ~0.03 GB/s EFA story.","resources":["r-nvcre-repo","r-nvcre-i405","r-nccl-docs"],"startHere":"r-nvcre-repo","prereqs":[],"related":["e-13","a-fabrics"],"aliases":["aws-ofi-nccl","TCP fallback","net plugin"],"flags":[],"anchors":["anc-tcp-fallback","anc-fabrics"],"seenIn":["S5","C4/§7"],"cards":["e-07","e-13"],"formulas":[],"paths":["p-1"]},{"id":"a-topology-aware","module":"a","title":"Topology-aware grouping","tier":"CORE","refresher":"Clouds expose placement labels (AWS network-node-layer, GCP gce-topology-block, Azure PPG). Grouping nodes by these labels keeps tests and jobs inside low-hop domains.","whyHere":"diagnose groups.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":["d-group-testing"],"aliases":["topology labels","network-node-layer","gce-topology-block","PPG"],"flags":[],"anchors":["anc-topo-labels"],"seenIn":["S4"],"cards":["e-07","e-11"],"formulas":[],"paths":[]},{"id":"a-scheduling","module":"a","title":"Gang & topology scheduling","tier":"CORE","refresher":"Distributed jobs need all-or-nothing placement (gang scheduling: KAI, Run:ai, Kueue). Fragmentation and mixed GPU types break that.","whyHere":"Homogeneity limit.","resources":["r-borg-omega-k8s"],"startHere":"r-borg-omega-k8s","prereqs":[],"related":["e-11","a-k8s-batch"],"aliases":["gang scheduling","KAI","Run:ai"],"flags":[],"anchors":["anc-gang","anc-homog"],"seenIn":["S6","S7"],"cards":["e-11"],"formulas":[],"paths":[]},{"id":"a-k8s-batch","module":"a","title":"Kueue & Kubeflow Trainer","tier":"CORE","refresher":"Kueue queues and admits (suspends/unsuspends) batch workloads. Kubeflow Trainer’s TrainJob runs distributed training. NVCRE drives TrainJobs through an adapter.","whyHere":"S3/S5 lifecycle.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":["a-scheduling"],"aliases":["Kueue","TrainJob","Kubeflow Trainer"],"flags":[],"anchors":["anc-trainjob","anc-kueue"],"seenIn":["S3","S5"],"cards":["e-11"],"formulas":[],"paths":[]},{"id":"a-slurm","module":"a","title":"Slurm contrast","tier":"CORE","refresher":"Slurm allocates nodes and launches ranks with srun. Topology/block plugins provide placement. Health is usually checked by NHC, run periodically or in prolog/epilog.","whyHere":"Readers fluent in Slurm.","resources":["r-stas-mle"],"startHere":"r-stas-mle","prereqs":[],"related":["a-passive-health"],"aliases":["srun"],"flags":[],"anchors":["anc-slurm"],"seenIn":["S6"],"cards":[],"formulas":[],"paths":[]},{"id":"a-stack-compat","module":"a","title":"Stack compatibility matrices","tier":"CORE","refresher":"Driver, CUDA, NCCL, OFED/EFA, NIC and GPU firmware must match tested combinations. AICR pins these. Drift causes silent fallbacks or hangs.","whyHere":"S5, C3 wrong firmware.","resources":["r-nvcre-repo","r-aicr"],"startHere":"r-nvcre-repo","prereqs":[],"related":["e-13","a-rdma"],"aliases":["firmware","version matrix","drift"],"flags":[],"anchors":["anc-matrix","anc-f-fw"],"seenIn":["S5","C3"],"cards":["e-13"],"formulas":[],"paths":[]},{"id":"a-observability","module":"a","title":"Metrics & results export","tier":"CORE","refresher":"NVCRE exposes Prometheus metrics (via ServiceMonitor) and JSON results. Pair them with DCGM exporter for continuous telemetry.","whyHere":"S5.","resources":["r-nvcre-repo"],"startHere":"r-nvcre-repo","prereqs":[],"related":["e-14"],"aliases":["Prometheus","ServiceMonitor","results-file"],"flags":[],"anchors":["anc-metrics"],"seenIn":["S5"],"cards":["e-14"],"formulas":[],"paths":[]},{"id":"a-gpu-generations","module":"a","title":"GPU generations (dated)","tier":"CORE","refresher":"Hopper (H100/H200), Blackwell (B200/GB200), Blackwell Ultra (GB300), then Rubin. NVIDIA lists Rubin at 288 GB HBM4 and 22 TB/s, with partner availability in H2 2026 (CES 2026; status as of 2026-10-08).","whyHere":"§7 GPUs; dated.","resources":["r-li-generations","r-ie-gpu-inference"],"startHere":"r-li-generations","prereqs":[],"related":["e-01"],"aliases":["Hopper","Blackwell","Rubin","H100","GB200","GB300"],"flags":["Rubin status softened to what §23 supports"],"anchors":["anc-gpus"],"seenIn":["C4/§7"],"cards":["e-01"],"formulas":[],"paths":[]},{"id":"a-parallelism","module":"a","title":"Parallelism (training)","tier":"CORE","refresher":"DP replicates the model. TP splits layers (NVLink-heavy). PP splits stages (bubbles). CP/SP split the sequence. EP splits MoE experts (all-to-all). Megatron composes them.","whyHere":"NVCRE pretraining workloads.","resources":["r-ultrascale","r-megatron"],"startHere":"r-ultrascale","prereqs":[],"related":["e-04","f-10"],"aliases":["DP","TP","PP","EP","Megatron","NeMo"],"flags":[],"anchors":["anc-megatron"],"seenIn":["C4/§7"],"cards":["e-04"],"formulas":["f-03","f-10"],"paths":[]},{"id":"a-benchmarks","module":"a","title":"Benchmarks (HPL, MLPerf)","tier":"CORE","refresher":"HPL/GEMM measure dense FLOPs, not fabric health. MLPerf measures end-to-end training/inference at fixed quality.","whyHere":"HPL is only an indirect signal.","resources":["r-ultrascale"],"startHere":"r-ultrascale","prereqs":[],"related":["e-14"],"aliases":["HPL","GEMM","MLPerf"],"flags":["Tier set to CORE: anchored at anc-hpl (spec §12 says C, §14 table said E)"],"anchors":["anc-hpl"],"seenIn":["C4/§7"],"cards":["e-14"],"formulas":[],"paths":[]},{"id":"b-three-layers","module":"b","title":"Runtime · infrastructure · tooling","tier":"EXTENDED","refresher":"The book’s framing: runtime (kernels/engines/techniques), infrastructure (autoscaling, capacity, multi-cloud) and tooling. Each layer fails differently.","whyHere":"Readiness touches infra + hardware, not runtime tuning.","resources":["r-li-ch0","r-ie-ch0"],"startHere":"r-li-ch0","prereqs":[],"related":[],"aliases":[],"flags":[],"anchors":[],"seenIn":[],"cards":["e-12"],"formulas":[],"paths":[]},{"id":"b-scale-problem","module":"b","title":"Scale changes the problem","tier":"EXTENDED","refresher":"Past a few hundred GPUs, capacity spreads across regions and clouds, and the problem shifts from optimization to capacity management. (book framing, secondary)","whyHere":"Why multi-cluster readiness matters.","resources":["r-li-ch0","r-ie-ch0"],"startHere":"r-li-ch0","prereqs":[],"related":["e-12"],"aliases":[],"flags":[],"anchors":[],"seenIn":[],"cards":["e-12"],"formulas":[],"paths":[]},{"id":"b-abstraction","module":"b","title":"Where to put the abstraction","tier":"EXTENDED","refresher":"Choose what the platform hides (hardware, engine, cloud) vs what it exposes. (book §0.5)","whyHere":"Validation must certify the layer you abstract over.","resources":["r-li-ch0"],"startHere":"r-li-ch0","prereqs":[],"related":["e-12"],"aliases":[],"flags":[],"anchors":[],"seenIn":[],"cards":["e-12"],"formulas":[],"paths":[]},{"id":"b-prefill-decode","module":"b","title":"Prefill vs decode","tier":"EXTENDED","refresher":"Prefill processes the whole prompt in parallel (compute-bound → TTFT). Decode emits one token per pass, re-reading weights and KV each time (bandwidth-bound → ITL/TPOT).","whyHere":"Different hardware stress → different readine ed chunks per stage"},"assumptions":"GPipe/1F1B schedules; interleaving divides the bubble by v.","sources":["r-megatron"],"entries":["a-parallelism"],"anchors":[],"cards":["e-04"]},{"id":"f-11","title":"Little’s law","expr":"L = λ · W","vars":{"L":"requests in flight","λ":"arrival rate","W":"time in system"},"assumptions":"Steady state.","sources":[],"sourceNote":"Standard queueing result","entries":["b-latency-metrics","b-batching"],"anchors":[],"cards":["e-05"]},{"id":"f-12","title":"Optimal checkpoint interval (Young/Daly)","expr":"τ_opt ≈ √(2 · δ · M)","vars":{"δ":"time to write a checkpoint","M":"MTBF"},"assumptions":"First-order; assumes δ ≪ M.","sources":["r-young","r-daly"],"sourceNote":"Young 1974 / Daly 2006 (DOIs filled at build; see their verification status)","entries":["a-reliability-data"],"anchors":[],"cards":["e-08","e-10"]},{"id":"f-13","title":"Synchronous step time","expr":"step time = max over ranks (compute_i + comm)","vars":{},"assumptions":"Synchronous SGD.","sources":["r-tail-at-scale"],"entries":["d-sync-step"],"anchors":["anc-sync-step"],"cards":[]},{"id":"f-14","title":"Adaptive binary splitting","expr":"tests ≈ ⌈log₂ N⌉ for 1 defective","vars":{"N":"items (nodes) in the pool"},"assumptions":"Deterministic test; NVCRE adds screening and confirmation runs.","sources":["r-group-testing"],"entries":["d-group-testing"],"anchors":["anc-bisection"],"cards":["e-15"]},{"id":"f-15","title":"Cluster MTBF","expr":"cluster MTBF ≈ component MTBF / N","vars":{"N":"components (GPUs)"},"assumptions":"Independent, exponential failures; correlated failures (shared PSU, an NVL72 tray) break it.","sources":["r-meta-reliability"],"entries":["a-reliability-data"],"anchors":[],"cards":["e-08"]}],"cards":[{"id":"e-01","title":"HBM capacity/bandwidth wall & KV growth","why":"Weights + KV must fit in HBM, and decode re-reads both every token.","numbers":[{"v":"H100 SXM: 80 GB HBM3 at 3.35 TB/s","date":"2026-10-08","src":"r-ie-gpu-inference"},{"v":"Rubin: 288 GB HBM4 at 22 TB/s; NVIDIA said partner availability in H2 2026","date":"2026-01-05","src":null,"note":"NVIDIA figures via secondary quotes (§23); no verified URL"}],"levers":["GQA/MLA","FP8/FP4 KV","paging","offload"],"gains":"More concurrent sequences per GPU.","costs":"Quality risk from lower precision; transfer cost from offload.","signatures":["OOM","preemption churn","p99 TPOT spikes"],"nvcre":"DCGM level-4 memtest checks HBM integrity, not capacity planning. Capacity is not covered by NVCRE today.","coverage":"partial","links":["b-kv-cache","b-quant","b-caching","c-gpu-arch","c-flashattn","a-gpu-generations","a-dcgm"],"formulas":["f-05","f-06","f-07"],"resources":[],"matrix":{"lever":"KV precision/GQA","gain":"concurrency","cost":"quality","check":"dcgm L4 (integrity only)"},"anchors":[]},{"id":"e-02","title":"Compute- vs memory-bound regimes","why":"Decode arithmetic intensity ≈ batch size; prefill ≈ prompt tokens. Which side of the ridge you are on decides what helps.","numbers":[{"v":"H100 FP16 ≈ 989 TFLOPS (dense) ÷ 3.35 TB/s ≈ 295 ops/byte","date":"2026-10-08","src":"r-li-bottlenecks","note":"Site figure; consistent with NVIDIA dense specs"}],"levers":["batching","chunked prefill","disaggregation"],"gains":"Higher throughput per GPU.","costs":"Higher per-token latency at large batch.","signatures":["low SM utilization in decode"],"nvcre":"avgTFLOPsPerGPU (training) is the only compute signal. Inference regimes are not covered by NVCRE today.","coverage":"no","links":["b-prefill-decode","b-bottlenecks","c-roofline","c-gpu-arch","c-lowprec","c-cuda-model","b-batching","b-modalities"],"formulas":["f-08","f-07"],"resources":[],"matrix":{"lever":"batching","gain":"throughput","cost":"latency","check":"none (inference)"},"anchors":[]},{"id":"e-03","title":"Scale-up vs scale-out","why":"NVLink domain bandwidth ≫ NIC bandwidth, so put TP/EP inside the domain.","numbers":[{"v":"AWS GB200 ×4 all-reduce busBW at 16 GB: 882.51 GB/s with MNNVL vs 191.40 GB/s without (~4.
